name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Retrieval evals
        # Runs only once hand labels exist; a missing labels file is not a failure.
        run: |
          if python -c "import json,sys; d=json.load(open('evals/labels.json')); sys.exit(0 if d.get('labels') else 1)" 2>/dev/null; then
            python -m jobfit.cli eval --labels evals/labels.json
          else
            echo "no hand labels yet — skipping evals (see evals/README.md)"
          fi
